name: iOS CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test core package
        working-directory: Packages/SuperOTPKit
        run: swift test

      - name: Build app for iOS Simulator
        if: hashFiles('SuperOTP.xcodeproj/project.pbxproj') != ''
        run: |
          status=0
          xcodebuild \
            -project SuperOTP.xcodeproj \
            -scheme SuperOTP \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1 || status=$?
          grep -E 'error:|warning:' build.log | sort -u | head -300 || true
          tail -n 20 build.log
          exit $status
